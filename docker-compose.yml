services:
  neo4j:
    image: neo4j:5.26
    container_name: neo4j

    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"

    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["apoc"]'

    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data: